<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Gradiente vibrante de fundo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb"/>
      <stop offset="55%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#2575fc"/>
    </linearGradient>
    <!-- Gradiente do selo de check -->
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <!-- Brilho sutil -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Brilho superior -->
  <rect width="128" height="64" rx="28" fill="url(#gloss)"/>

  <!-- Card de trás (levemente inclinado) -->
  <g transform="rotate(-8 64 64)">
    <rect x="34" y="26" width="60" height="76" rx="10" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Card da frente (a colinha) -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="30" width="64" height="76" rx="11" fill="#ffffff"/>
  </g>

  <!-- Topo/aba da colinha -->
  <rect x="47" y="24" width="30" height="12" rx="6" fill="#e8e8f5" stroke="#d0d0e6" stroke-width="1.5"/>

  <!-- Linhas coloridas (representam os textos/emails prontos) -->
  <line x1="42" y1="50" x2="82" y2="50" stroke="#6a11cb" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="63" x2="74" y2="63" stroke="#f5576c" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="76" x2="82" y2="76" stroke="#2575fc" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="89" x2="68" y2="89" stroke="#38ef7d" stroke-width="5" stroke-linecap="round"/>

  <!-- Selo de check (canto inferior direito) -->
  <circle cx="96" cy="96" r="20" fill="url(#check)" stroke="#ffffff" stroke-width="4"/>
  <path d="M87 96 L94 103 L106 89" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
